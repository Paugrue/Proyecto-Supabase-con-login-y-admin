<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3ecf8e;
            --primary-hover: #34b27b;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --danger: #fa4d4d;
            --admin: #7209b7;
            --border: #333333;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            max-width: 550px; 
            margin: 40px auto; 
            padding: 20px; 
            line-height: 1.5;
        }

        h2 { color: var(--primary); font-weight: 600; text-align: center; margin-bottom: 30px; }
        h3 { font-size: 1.1rem; margin-top: 0; color: var(--text); }

        .section { 
            background: var(--card-bg);
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 24px; 
        }

        input { 
            display: block; width: 100%; margin: 12px 0; padding: 12px; 
            background: #0d0d0d; border: 1px solid var(--border); color: white;
            border-radius: 8px; box-sizing: border-box; transition: 0.2s;
            font-size: 0.95rem;
        }

        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(62, 207, 142, 0.2); }

        button { 
            background: var(--primary); color: #000; font-weight: 600;
            border: none; padding: 12px; cursor: pointer; border-radius: 8px; 
            width: 100%; transition: all 0.2s ease; font-size: 0.95rem;
        }

        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Lista de Tareas Estilo Tarjeta */
        ul { list-style: none; padding: 0; margin-top: 20px; }

        li { 
            background: #262626; margin-bottom: 10px; padding: 14px 18px; 
            border-radius: 10px; display: flex; justify-content: space-between; 
            align-items: center; border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        li:hover { border-color: #444; }

        .task-content { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .task-title { font-weight: 500; font-size: 1rem; color: #fff; }
        .task-user { font-size: 0.75rem; color: var(--text-muted); }

        .task-actions { display: flex; gap: 10px; align-items: center; }

        .btn-icon { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        
        .file-link { text-decoration: none; font-size: 1.2rem; filter: grayscale(1); transition: 0.2s; }
        .file-link:hover { filter: grayscale(0); transform: scale(1.1); }

        #admin-btn { background: var(--admin); color: white; margin-bottom: 20px; border: none; }
        
        /* Animación suave para la aparición de la app */
        #app-section { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <h2>Supabase BaaS</h2>

    <div id="auth-section" class="section">
        <h3>Bienvenido</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="login-btn" onclick="app.handleLogin()">Entrar / Registrarse</button>
    </div>

    <div id="app-section" class="section" style="display:none;">
        <div id="admin-container"></div>
        <h3>Mis Tareas</h3>
        <input type="text" id="task-title" placeholder="¿Qué hay que hacer hoy?">
        <input type="file" id="task-file" style="font-size: 0.8rem; border: dashed 1px var(--border);">
        <button id="add-btn" onclick="app.addTask()">Añadir Tarea</button>
        
        <ul id="task-list"></ul>
        
        <button onclick="app.handleLogout()" style="background:transparent; border: 1px solid var(--danger); color:var(--danger); margin-top:30px;">Cerrar Sesión</button>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
